<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Huddle toast</title>
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div class="toast" id="toast" role="status">
  <span class="toast-name" id="toast-name"></span>
  <span class="toast-kind" id="toast-kind"></span>
  <button type="button" class="toast-close" id="toast-close" tabindex="-1" aria-label="Close notification" title="Close">×</button>
</div>
<script src="toast.js"></script>
</body>
</html>
